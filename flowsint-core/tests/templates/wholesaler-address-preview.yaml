name: wholesaler-address-preview
category: Location
version: 1.0
execution_mode: preview

input:
  type: Location
  key: address

request:
  method: GET
  url: https://geocoding.geo.census.gov/geocoder/locations/onelineaddress
  params:
    address: "{{address}}"
    benchmark: Public_AR_Current
    format: json
  timeout: 10

response:
  expect: json
  map:
    address: result.addressMatches.0.matchedAddress
    city: result.addressMatches.0.addressComponents.city
    country: result.addressMatches.0.addressComponents.country
    zip: result.addressMatches.0.addressComponents.zip
    latitude: result.addressMatches.0.coordinates.y
    longitude: result.addressMatches.0.coordinates.x

output:
  type: Location
